# Repository settings: enable auto-merge and allow GitHub Actions to approve PRs.
# Optional Actions secret: DEPENDABOT_AUTOMERGE_TOKEN, for workflow-file updates
# or repositories using a merge queue. The token needs Contents and Pull requests
# write access, plus Workflows write access for workflow-file updates
# (classic PAT scopes: repo, workflow). Otherwise, use GITHUB_TOKEN.
name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.draft == false
    env:
      GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    # Keep this privileged workflow API-only; do not check out or run PR code.
    steps:
      - name: Approve Dependabot PR
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(gh pr view "$PR_URL" --json reviewDecision -q '.reviewDecision')" != "APPROVED" ]; then
            gh pr review --approve "$PR_URL"
          else
            echo "PR already approved: $PR_URL"
          fi

      - name: Enable squash auto-merge
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
