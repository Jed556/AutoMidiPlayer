name: Bump Version

on:
  push:
    branches:
      - rewrite-experimental
      - main

concurrency:
  group: bump-version-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump:
    if: github.event.deleted == false
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.after }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Analyze commits & evaluate version bump
        id: evaluate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node scripts/bump-version.mjs analyze "$BEFORE_SHA" "$AFTER_SHA"

      - name: Amend each commit with its version
        id: amend
        if: steps.evaluate.outputs.bumped == 'true'
        run: |
          node scripts/bump-version.mjs commit

      # GITHUB_TOKEN pushes do not trigger another workflow run. Keep the
      # original commit messages; no [skip ci] marker or bump commit is needed.
      # Branch rules must allow this workflow to force-push amended history.
      - name: Push amended history with an explicit lease
        id: push
        if: steps.evaluate.outputs.bumped == 'true'
        run: |
          node scripts/bump-version.mjs push

      - name: Publish version bumper summary
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node scripts/bump-version.mjs summary
