name: Bump Version

on:
  push:
    branches:
      - rewrite-experimental
      - main

concurrency:
  group: bump-version-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Analyze commits & evaluate version bump
        id: evaluate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node scripts/bump-version.mjs analyze "$BEFORE_SHA" "$AFTER_SHA"

      - name: Apply version bump to project files
        id: apply
        if: steps.evaluate.outputs.bumped == 'true'
        run: |
          node scripts/bump-version.mjs apply "${{ steps.evaluate.outputs.target_version }}"

      - name: Commit and push bumped version
        id: commit_push
        if: steps.evaluate.outputs.bumped == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node scripts/bump-version.mjs push "${{ steps.evaluate.outputs.target_version }}"

      - name: Publish version bumper summary
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node scripts/bump-version.mjs summary
