name: Bump Version

on:
  push:
    branches:
      - main

concurrency:
  # An App-authenticated push starts workflows. Keep its skipped run from
  # cancelling the source run while that run is finishing its push/summary.
  group: bump-version-${{ github.ref_name }}-${{ github.actor == format('{0}[bot]', vars.VERSION_BUMP_APP_SLUG) && 'bot' || 'source' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    if: github.event.deleted == false && github.actor != format('{0}[bot]', vars.VERSION_BUMP_APP_SLUG)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.after }}
          # Push authentication is configured separately with the App token.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Analyze commits & evaluate version bump
        id: evaluate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node scripts/bump-version.mjs analyze "$BEFORE_SHA" "$AFTER_SHA"

      - name: Check versioning App configuration
        if: steps.evaluate.outputs.bumped == 'true'
        env:
          VERSION_BUMP_APP_ID: ${{ vars.VERSION_BUMP_APP_ID }}
          VERSION_BUMP_APP_SLUG: ${{ vars.VERSION_BUMP_APP_SLUG }}
          VERSION_BUMP_APP_PRIVATE_KEY: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const required = ['VERSION_BUMP_APP_ID', 'VERSION_BUMP_APP_SLUG', 'VERSION_BUMP_APP_PRIVATE_KEY'];
          const missing = required.filter(name => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Configure ${missing.join(', ')} before amending versions. See CONTRIBUTING.md#versioning-bot-setup-maintainers.`);
          JS

      - name: Create repository-scoped versioning App token
        id: app_token
        if: steps.evaluate.outputs.bumped == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # Required when a rewritten commit contains workflow-file changes.
          permission-workflows: write

      - name: Verify versioning App identity
        if: steps.evaluate.outputs.bumped == 'true'
        env:
          EXPECTED_APP_SLUG: ${{ vars.VERSION_BUMP_APP_SLUG }}
          ACTUAL_APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          test "$ACTUAL_APP_SLUG" = "$EXPECTED_APP_SLUG" || {
            echo '::error::VERSION_BUMP_APP_SLUG does not match the configured GitHub App.'
            exit 1
          }

      - name: Amend each commit with its version
        id: amend
        if: steps.evaluate.outputs.bumped == 'true'
        run: |
          node scripts/bump-version.mjs commit

      # Other CI workflows run on the App's amended commit; the job-level actor
      # guard skips this bumper's own push without changing commit messages.
      - name: Push amended history with an explicit lease
        id: push
        if: steps.evaluate.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          gh auth setup-git
          node scripts/bump-version.mjs push

      - name: Publish version bumper summary
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          node scripts/bump-version.mjs summary
