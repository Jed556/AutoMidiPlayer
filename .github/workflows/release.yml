name: Release rewrite

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Auto: infer from commit prefixes since the last stable release. Override with 8.1.0 or 8.1.0-beta.1 / 8.1.0-rc.1'
        required: false
        default: 'auto'
        type: string
      beta:
        description: 'Publish a beta prerelease (automatically adds/increments -beta.N)'
        type: boolean
        default: false
      build_only:
        description: 'Validate all packages without pushing commits/tags or publishing'
        type: boolean
        default: true

concurrency:
  group: release-rewrite
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notices:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'workflow_dispatch'
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          key: release-notices
      - name: Generate current dependency notices
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          node scripts/generate-licenses.mjs
      - run: node --test tests/licenses.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-notices
          path: THIRD-PARTY-LICENSES.md
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: notices
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check release signing configuration
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.AMP_UPDATER_PUBLIC_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'JS'
          if (!process.env.KEY || !process.env.PUBLIC_KEY) throw new Error('Configure TAURI_SIGNING_PRIVATE_KEY and the AMP_UPDATER_PUBLIC_KEY repository variable.');
          for (const names of [
            ['WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD'],
            ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID'],
          ]) {
            if (names.some(name => process.env[name]) && !names.every(name => process.env[name])) throw new Error(`Incomplete OS signing configuration: ${names.join(', ')}`);
          }
          JS
      - uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          args: --offline --unreleased --tag v8.0.0 --output dist/git-cliff-bootstrap.md
      - name: Verify release tooling
        env:
          GIT_CLIFF_BIN: ${{ runner.temp }}/git-cliff/bin/git-cliff
        run: node --test tests/release.test.mjs
      - uses: actions/download-artifact@v8
        with:
          name: dependency-notices
          path: dist/license-input
      - name: Prepare or validate release commit
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ONLY: ${{ inputs.build_only }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          VERSION_INPUT: ${{ inputs.version }}
          BETA_RELEASE: ${{ inputs.beta }}
          GIT_CLIFF_BIN: ${{ runner.temp }}/git-cliff/bin/git-cliff
          RELEASE_LICENSE_MANIFEST: dist/license-input/THIRD-PARTY-LICENSES.md
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF_TYPE" = branch || { echo 'Select a source branch for preparation'; exit 1; }
            node scripts/release.mjs prepare "$VERSION_INPUT"
          else
            node scripts/release.mjs validate "$GITHUB_REF_NAME"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-input
          path: dist/release-input/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      AMP_UPDATER_PUBLIC_KEY: ${{ vars.AMP_UPDATER_PUBLIC_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AMP_RELEASE_BUILD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-input
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev libudev-dev libx11-dev libxtst-dev libxi-dev libxkbcommon-dev
      - run: pnpm install --frozen-lockfile
      - name: Test startup and updater behavior
        run: node --test tests/update.test.mjs tests/startup.test.mjs
      - name: Validate versions and stage bundled notices
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          node scripts/release.mjs validate "$VERSION"
          node scripts/stage-release-docs.mjs
          node scripts/configure-release.mjs
      - name: Configure Windows signing
        if: runner.os == 'Windows'
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $config = @{ bundle = @{ windows = @{} } }
          if ($env:CERTIFICATE) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'amp-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE))
            try {
              $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
              $config.bundle.windows.certificateThumbprint = $certificate.Thumbprint
              $config.bundle.windows.digestAlgorithm = 'sha256'
              $config.bundle.windows.timestampUrl = 'http://timestamp.digicert.com'
            } finally { Remove-Item -LiteralPath $pfxPath -Force }
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $config | ConvertTo-Json -Depth 8 | Set-Content -Path dist/signing.json -Encoding utf8
      - name: Build native packages
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--target "$TARGET" --bundles "$BUNDLES" --config dist/release-config.json)
          if [ "$RUNNER_OS" = Windows ]; then args+=(--config dist/signing.json); fi
          pnpm tauri build "${args[@]}" -- --locked
      - name: Test native code
        run: cargo test --workspace --lib --locked
      - name: Stage and verify release packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: node scripts/package-release.mjs stage "$VERSION" "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-input
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist/downloaded
      - name: Validate complete asset set and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AMP_UPDATER_PUBLIC_KEY: ${{ vars.AMP_UPDATER_PUBLIC_KEY }}
        run: node scripts/package-release.mjs collect "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: complete-release
          path: dist/release-assets/
          retention-days: 7
      - name: Publish and react
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node scripts/publish-release.mjs "$VERSION"
