# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # The root Cargo workspace includes src-tauri and crates/amp-core.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "deps"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # Dependabot uses the npm ecosystem for pnpm projects.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
