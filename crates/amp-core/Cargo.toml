[package]
name = "amp-core"
version = "0.1.0"
description = "High-precision MIDI playback and input simulation engine for Auto MIDI Player"
authors = ["Jed556 <jguiriba11@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Jed556/AutoMidiPlayer"
homepage = "https://github.com/Jed556/AutoMidiPlayer"
readme = "../../README.md"
edition = "2021"
rust-version = "1.90"

[dependencies]
midly = { version = "0.5", features = ["std"] }
thiserror = "2"
ctrlc = "3.4"
spin_sleep = "1.3"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
enigo = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustysynth = "1.3"
rodio = { version = "0.20", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "fast-rng", "serde"] }
sha2 = "0.10"
rayon = "1.10"
chrono = "0.4"
walkdir = "2.5"
notify = "6.1"
regex = "1.11"

[[bin]]
name = "amp-cli"
path = "src/main.rs"

[lib]
name = "amp_core"
path = "src/lib.rs"
